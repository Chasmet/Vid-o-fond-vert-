plugins {
    id 'com.android.application'
}

// ===== RVM : conservé uniquement pour photo/export haute qualité =====
def generatedRvmRoot = file("$buildDir/generated/rvm")
def rvmAssetsDir = file("$generatedRvmRoot/assets")
def rvmParamFile = file("$rvmAssetsDir/rvm_mobilenetv3.ncnn.param")
def rvmBinFile = file("$rvmAssetsDir/rvm_mobilenetv3.ncnn.bin")
def ncnnZipFile = file("$generatedRvmRoot/ncnn-20260526-android.zip")
def ncnnSdkDir = file("$generatedRvmRoot/ncnn-sdk")

def rvmParamUrl = 'https://raw.githubusercontent.com/nihui/ncnn-android-rvm/master/app/src/main/assets/rvm_mobilenetv3.ncnn.param'
def rvmBinUrl = 'https://raw.githubusercontent.com/nihui/ncnn-android-rvm/master/app/src/main/assets/rvm_mobilenetv3.ncnn.bin'
def ncnnUrl = 'https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android.zip'

// ===== PP-HumanSegV2-Lite : moteur dédié à l'aperçu temps réel =====
def generatedHumanSegRoot = file("$buildDir/generated/pp-humanseg")
def humanSegAssetsDir = file("$generatedHumanSegRoot/assets")
def humanSegModelDir = file("$humanSegAssetsDir/pp_humanseg")
def humanSegNbFile = file("$humanSegModelDir/model.nb")
def humanSegZipFile = file("$generatedHumanSegRoot/pp_humansegv2_lite.zip")
def humanSegExtractDir = file("$generatedHumanSegRoot/inference")
def paddleArm64Tar = file("$generatedHumanSegRoot/paddle_lite_2_13_armv8.tar.gz")
def paddleArmv7Tar = file("$generatedHumanSegRoot/paddle_lite_2_13_armv7.tar.gz")
def paddleArm64ExtractDir = file("$generatedHumanSegRoot/paddle-arm64")
def paddleArmv7ExtractDir = file("$generatedHumanSegRoot/paddle-armv7")
def paddleJarFile = file("$generatedHumanSegRoot/libs/PaddlePredictor.jar")
def paddleJniDir = file("$generatedHumanSegRoot/jniLibs")
def paddleOptFile = file("$generatedHumanSegRoot/opt_linux_x86")

def humanSegUrl = 'https://paddleseg.bj.bcebos.com/dygraph/pp_humanseg_v2/human_pp_humansegv2_lite_192x192_inference_model_with_softmax.zip'
def paddleArm64Url = 'https://github.com/PaddlePaddle/Paddle-Lite/releases/download/v2.13-rc/inference_lite_lib.android.armv8.clang.c++_static.tar.gz'
def paddleArmv7Url = 'https://github.com/PaddlePaddle/Paddle-Lite/releases/download/v2.13-rc/inference_lite_lib.android.armv7.clang.c++_static.tar.gz'
def paddleOptUrl = 'https://github.com/PaddlePaddle/Paddle-Lite/releases/download/v2.13-rc/opt_linux_x86'

def downloadTo = { String url, File target ->
    target.parentFile.mkdirs()
    File temporary = new File(target.parentFile, target.name + '.part')
    if (temporary.exists()) temporary.delete()
    new URL(url).withInputStream { input ->
        temporary.withOutputStream { output ->
            byte[] buffer = new byte[256 * 1024]
            int count
            while ((count = input.read(buffer)) != -1) output.write(buffer, 0, count)
        }
    }
    if (target.exists()) target.delete()
    if (!temporary.renameTo(target)) {
        throw new GradleException('Impossible de finaliser ' + target.name)
    }
}

tasks.register('prepareRvmAssets') {
    outputs.files(rvmParamFile, rvmBinFile)
    doLast {
        if (!rvmParamFile.isFile() || rvmParamFile.length() < 20_000L) {
            println 'Téléchargement du graphe RVM MobileNetV3…'
            downloadTo(rvmParamUrl, rvmParamFile)
        }
        if (!rvmBinFile.isFile() || rvmBinFile.length() < 7_000_000L) {
            println 'Téléchargement des poids RVM MobileNetV3 (~7,2 Mo)…'
            downloadTo(rvmBinUrl, rvmBinFile)
        }
        if (rvmParamFile.length() < 20_000L || rvmBinFile.length() < 7_000_000L) {
            throw new GradleException('Modèle RVM incomplet')
        }
    }
}

tasks.register('prepareNcnnSdk') {
    outputs.dir(ncnnSdkDir)
    doLast {
        File marker = new File(ncnnSdkDir, '.ready')
        if (!marker.isFile()) {
            if (!ncnnZipFile.isFile() || ncnnZipFile.length() < 15_000_000L) {
                downloadTo(ncnnUrl, ncnnZipFile)
            }
            delete ncnnSdkDir
            ncnnSdkDir.mkdirs()
            copy {
                from zipTree(ncnnZipFile)
                into ncnnSdkDir
            }
            def configs = fileTree(ncnnSdkDir).matching {
                include '**/arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake'
            }.files
            if (configs.isEmpty()) throw new GradleException('SDK ncnn Android invalide')
            marker.text = 'ncnn 20260526'
        }
    }
}

tasks.register('prepareRvmNativeDependencies') {
    dependsOn tasks.named('prepareRvmAssets'), tasks.named('prepareNcnnSdk')
}

// Runtime Java officiel Paddle Lite 2.13-rc, identique au convertisseur utilisé pour model.nb.
tasks.register('preparePaddleLiteRuntime') {
    outputs.files(paddleJarFile,
            file("$paddleJniDir/arm64-v8a/libpaddle_lite_jni.so"),
            file("$paddleJniDir/armeabi-v7a/libpaddle_lite_jni.so"))
    doLast {
        File arm64 = file("$paddleJniDir/arm64-v8a/libpaddle_lite_jni.so")
        File armv7 = file("$paddleJniDir/armeabi-v7a/libpaddle_lite_jni.so")
        if (paddleJarFile.isFile() && paddleJarFile.length() > 10_000L
                && arm64.isFile() && arm64.length() > 500_000L
                && armv7.isFile() && armv7.length() > 500_000L) return

        println 'Préparation Paddle Lite Android 2.13-rc…'
        if (!paddleArm64Tar.isFile() || paddleArm64Tar.length() < 1_000_000L) {
            downloadTo(paddleArm64Url, paddleArm64Tar)
        }
        if (!paddleArmv7Tar.isFile() || paddleArmv7Tar.length() < 1_000_000L) {
            downloadTo(paddleArmv7Url, paddleArmv7Tar)
        }

        delete paddleArm64ExtractDir
        delete paddleArmv7ExtractDir
        paddleArm64ExtractDir.mkdirs()
        paddleArmv7ExtractDir.mkdirs()
        copy {
            from tarTree(resources.gzip(paddleArm64Tar))
            into paddleArm64ExtractDir
        }
        copy {
            from tarTree(resources.gzip(paddleArmv7Tar))
            into paddleArmv7ExtractDir
        }

        File jarSource = fileTree(paddleArm64ExtractDir).matching {
            include '**/java/jar/PaddlePredictor.jar'
        }.files.find { it.isFile() }
        File arm64Source = fileTree(paddleArm64ExtractDir).matching {
            include '**/java/so/libpaddle_lite_jni.so'
        }.files.find { it.isFile() }
        File armv7Source = fileTree(paddleArmv7ExtractDir).matching {
            include '**/java/so/libpaddle_lite_jni.so'
        }.files.find { it.isFile() }
        if (jarSource == null || arm64Source == null || armv7Source == null) {
            throw new GradleException('Runtime Paddle Lite 2.13-rc Android incomplet')
        }

        paddleJarFile.parentFile.mkdirs()
        arm64.parentFile.mkdirs()
        armv7.parentFile.mkdirs()
        java.nio.file.Files.copy(jarSource.toPath(), paddleJarFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        java.nio.file.Files.copy(arm64Source.toPath(), arm64.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        java.nio.file.Files.copy(armv7Source.toPath(), armv7.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        println 'Paddle Lite Android 2.13-rc prêt'
    }
}

// Modèle officiel PaddleSeg converti avec l'outil officiel de la même version 2.13-rc.
tasks.register('prepareHumanSegModel') {
    outputs.file(humanSegNbFile)
    doLast {
        if (humanSegNbFile.isFile() && humanSegNbFile.length() > 100_000L) return
        println 'Préparation du modèle PP-HumanSegV2-Lite 192x192…'
        if (!humanSegZipFile.isFile() || humanSegZipFile.length() < 100_000L) {
            downloadTo(humanSegUrl, humanSegZipFile)
        }
        if (!paddleOptFile.isFile() || paddleOptFile.length() < 1_000_000L) {
            println 'Téléchargement Paddle Lite opt 2.13-rc…'
            downloadTo(paddleOptUrl, paddleOptFile)
        }
        if (!paddleOptFile.setExecutable(true) && !paddleOptFile.canExecute()) {
            throw new GradleException('Convertisseur Paddle Lite non exécutable')
        }

        delete humanSegExtractDir
        humanSegExtractDir.mkdirs()
        copy {
            from zipTree(humanSegZipFile)
            into humanSegExtractDir
        }
        File pdmodel = fileTree(humanSegExtractDir).matching { include '**/*.pdmodel' }
                .files.find { it.isFile() }
        File pdiparams = fileTree(humanSegExtractDir).matching { include '**/*.pdiparams' }
                .files.find { it.isFile() }
        if (pdmodel == null || pdiparams == null) {
            throw new GradleException('Fichiers PaddleSeg inference introuvables')
        }
        humanSegModelDir.mkdirs()
        File optimizeBase = file("$humanSegModelDir/model")
        exec {
            commandLine paddleOptFile.absolutePath,
                    "--model_file=${pdmodel.absolutePath}",
                    "--param_file=${pdiparams.absolutePath}",
                    "--optimize_out=${optimizeBase.absolutePath}",
                    '--valid_targets=arm',
                    '--optimize_out_type=naive_buffer'
        }
        if (!humanSegNbFile.isFile() || humanSegNbFile.length() < 100_000L) {
            throw new GradleException('Conversion PP-HumanSeg en model.nb échouée')
        }
        println "PP-HumanSegV2-Lite prêt : ${String.format('%.2f', humanSegNbFile.length() / 1024d / 1024d)} Mo"
    }
}

tasks.register('prepareHumanSegDependencies') {
    dependsOn tasks.named('preparePaddleLiteRuntime'), tasks.named('prepareHumanSegModel')
}

android {
    namespace 'com.chasmet.fondvertstudio'
    compileSdk 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.chasmet.fondvertstudio'
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName '1.9.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DNCNN_SDK_ROOT=${ncnnSdkDir.absolutePath}",
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                cppFlags '-std=c++17 -O3'
            }
        }
    }

    sourceSets {
        main.assets.srcDir rvmAssetsDir
        main.assets.srcDir humanSegAssetsDir
        main.jniLibs.srcDir paddleJniDir
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    androidResources {
        noCompress += ['bin', 'param', 'nb']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareRvmNativeDependencies')
    dependsOn tasks.named('prepareHumanSegDependencies')
}

tasks.configureEach { task ->
    if (task.name.startsWith('configureCMake') || task.name.startsWith('buildCMake')) {
        task.dependsOn tasks.named('prepareNcnnSdk')
    }
    if (task.name.startsWith('compile') && task.name.contains('JavaWithJavac')) {
        task.dependsOn tasks.named('preparePaddleLiteRuntime')
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'

    def cameraxVersion = '1.4.1'
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-video:${cameraxVersion}"

    implementation files(paddleJarFile)

    // ML Kit n'est plus dans la boucle normale de l'aperçu ; il reste secours + guide export.
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'androidx.work:work-runtime:2.9.1'
}
