plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.fondvertstudio'
    compileSdk 34
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }

    defaultConfig {
        applicationId 'com.chasmet.fondvertstudio'
        minSdk 21
        targetSdk 34
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; targets 'chkwhisper' } }
        versionCode 43
        versionName '1.15.7'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
        if (keystorePath != null && !keystorePath.trim().isEmpty()) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'fondvertupdate'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets { release { assets.srcDir rootProject.file('.gradle/thirdparty/embedded-assets') } }
    androidResources { noCompress += ['bz2', 'onnx', 'bin'] }

    packaging {
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

// The official Android AAR is fetched and integrity-checked by the CI and local Gradle builds.
def sherpaAar = rootProject.file(".gradle/thirdparty/sherpa-onnx-1.13.7.aar")
def sherpaSha = 'c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8'
def sherpaValid = {
    if (!sherpaAar.isFile()) return false
    def md = java.security.MessageDigest.getInstance('SHA-256')
    sherpaAar.withInputStream { stream ->
        byte[] buf = new byte[65536]
        int read
        while ((read = stream.read(buf)) != -1) md.update(buf, 0, read)
    }
    md.digest().encodeHex().toString() == sherpaSha
}
if (!sherpaValid()) {
    sherpaAar.parentFile.mkdirs()
    def tmp = new File(sherpaAar.parentFile, 'sherpa.part')
    def conn = new URL('https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar').openConnection()
    conn.connectTimeout = 30000
    conn.readTimeout = 60000
    conn.inputStream.withCloseable { input -> tmp.withOutputStream { out -> out << input } }
    java.nio.file.Files.move(tmp.toPath(), sherpaAar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    if (!sherpaValid()) { sherpaAar.delete(); throw new GradleException('Sherpa AAR checksum mismatch') }
}

dependencies {
    implementation files(sherpaAar)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'

    def cameraxVersion = '1.4.1'
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-video:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'androidx.work:work-runtime:2.9.1'

    // Compatibilité des WAV/PCM : seule la portion réellement filmée est convertie à l'export.
    implementation 'androidx.media3:media3-transformer:1.4.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Download model weights only on the BUILD machine. No runtime network access is needed.
def prepareEmbeddedModels = tasks.register('prepareEmbeddedModels', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare_embedded_models.py'
    outputs.upToDateWhen { false }
}
tasks.configureEach { task ->
    if (task.name == 'mergeReleaseAssets' || task.name == 'lintVitalAnalyzeRelease' || task.name == 'lintAnalyzeRelease') task.dependsOn prepareEmbeddedModels
}
