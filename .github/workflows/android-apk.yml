name: Compiler APK Android

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fond Vert Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Compiler et tester l'APK
        run: ./gradlew --no-daemon clean assembleDebug lintDebug

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fond-Vert-Studio-v1.5.0-Clip-Musique.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fond-Vert-Studio-APK
          path: Fond-Vert-Studio-v1.5.0-Clip-Musique.apk
          if-no-files-found: error
          retention-days: 30
