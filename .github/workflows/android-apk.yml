name: Compiler APK Android

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: /home/runner/.android/fondvert-update.keystore
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    name: Conserver la signature Android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restaurer la clé de signature stable
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/fondvert-update.keystore
          key: fond-vert-studio-signing-v1

      - name: Vérifier que la clé existe toujours
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          fi
          if [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "ERREUR : la clé de signature stable n'est plus disponible."
            echo "Aucune nouvelle clé ne sera générée afin de ne pas casser les mises à jour Android."
            exit 1
          fi
          echo "Clé de signature restaurée : continuité des mises à jour préservée."

  android-api-tests:
    if: github.event_name != 'schedule'
    name: Tests Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 28, 34]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests instrumentés
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  build:
    if: github.event_name != 'schedule'
    needs: android-api-tests
    name: Fond Vert Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Restaurer la clé de signature stable
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/fondvert-update.keystore
          key: fond-vert-studio-signing-v1

      - name: Restaurer la clé depuis le Secret chiffré
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p ~/.android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Préparer la signature sans jamais la remplacer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p ~/.android
          STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-android}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-fondvertupdate}"
          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-android}"
          if [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Clé de signature stable restaurée."
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            exit 0
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ] && gh release list --limit 1 | grep -q .; then
            echo "ERREUR : une Release existe déjà mais la clé de signature historique est absente."
            echo "Le workflow refuse de générer une nouvelle clé car Android rejetterait les mises à jour."
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Fond Vert Studio Update,O=Chasmet,C=FR"
          echo "Première clé stable créée. Elle sera réutilisée pour toutes les prochaines Releases."

      - name: Vérifier le moteur stable
        run: |
          grep -q "Segmentation.getClient" app/src/main/java/com/chasmet/fondvertstudio/SegmentationEngine.java
          if grep -R -E "RvmNcnnEngine|PpHumanSegEngine|publishProcessedForeground" app/src/main/java/com/chasmet/fondvertstudio; then
            echo "ERREUR : un ancien pipeline expérimental est encore actif"
            exit 1
          fi

      - name: Compiler et tester les APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug assembleRelease lintDebug lintRelease

      - name: Lire la version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Impossible de lire versionName/versionCode"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier les APK finaux
        shell: bash
        run: |
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            if unzip -l "$APK" | grep -E "librvmncnn|rvm_mobilenetv3|paddle_lite|pp_humanseg"; then
              echo "ERREUR : moteur natif expérimental encore embarqué dans $APK"
              exit 1
            fi
          done
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          echo "APK propre et signé : CameraX + ML Kit uniquement pour le détourage"

      - name: Préparer les fichiers distribués
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "Fond-Vert-Studio-v${VERSION}.apk"
          sha256sum "Fond-Vert-Studio-v${VERSION}.apk" > "Fond-Vert-Studio-v${VERSION}.apk.sha256"

      - name: Publier l'APK installable dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: Fond-Vert-Studio-v${{ steps.version.outputs.version }}
          path: |
            Fond-Vert-Studio-v${{ steps.version.outputs.version }}.apk
            Fond-Vert-Studio-v${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publier la Release utilisée par l'application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release $TAG existe déjà : elle reste inchangée."
            echo "Pour distribuer une nouvelle mise à jour, incrémenter versionCode et versionName."
            exit 0
          fi
          gh release create "$TAG" \
            "Fond-Vert-Studio-v${VERSION}.apk#Fond Vert Studio v${VERSION} APK" \
            "Fond-Vert-Studio-v${VERSION}.apk.sha256#SHA-256" \
            --target "$GITHUB_SHA" \
            --title "Fond Vert Studio v${VERSION}" \
            --generate-notes
