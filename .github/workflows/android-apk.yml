name: Compiler APK Android

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fond Vert Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer NDK et CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.22.1" >/dev/null

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Compiler et tester PP-HumanSeg + rendu HQ
        run: ./gradlew --no-daemon clean assembleDebug lintDebug

      - name: Vérifier les moteurs locaux dans l'APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/pp_humanseg/model.nb"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/libpaddle_lite_jni.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/armeabi-v7a/libpaddle_lite_jni.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/rvm_mobilenetv3.ncnn.param"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/rvm_mobilenetv3.ncnn.bin"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/librvmncnn.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/armeabi-v7a/librvmncnn.so"
          echo "PP-HumanSegV2-Lite + fallback Android 16 + RVM export présents dans l'APK"

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fond-Vert-Studio-v1.9.1-Android16-Fix.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fond-Vert-Studio-APK
          path: Fond-Vert-Studio-v1.9.1-Android16-Fix.apk
          if-no-files-found: error
          retention-days: 30
