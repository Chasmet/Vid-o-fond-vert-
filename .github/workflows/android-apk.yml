name: Compiler APK Android

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fond Vert Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Vérifier le moteur stable
        run: |
          grep -q "Segmentation.getClient" app/src/main/java/com/chasmet/fondvertstudio/SegmentationEngine.java
          if grep -R -E "RvmNcnnEngine|PpHumanSegEngine|publishProcessedForeground" app/src/main/java/com/chasmet/fondvertstudio; then
            echo "ERREUR : un ancien pipeline expérimental est encore actif"
            exit 1
          fi

      - name: Compiler et tester l'APK
        run: ./gradlew --no-daemon clean assembleDebug lintDebug

      - name: Vérifier l'APK final
        run: |
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "librvmncnn|rvm_mobilenetv3|paddle_lite|pp_humanseg"; then
            echo "ERREUR : moteur natif expérimental encore embarqué"
            exit 1
          fi
          echo "APK propre : CameraX + ML Kit uniquement pour le détourage"

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fond-Vert-Studio-v1.10.0-Moteur-Stable.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Fond-Vert-Studio-v1.10.0-Moteur-Stable
          path: Fond-Vert-Studio-v1.10.0-Moteur-Stable.apk
          if-no-files-found: error
          retention-days: 30
